{
    "display_information": {
        "name": "helper heidi",
        "description": "making support teams run smoothly (and my partner proud)",
        "background_color": "#c47600"
    },
    "features": {
        "app_home": {
            "home_tab_enabled": true,
            "messages_tab_enabled": true,
            "messages_tab_read_only_enabled": true
        },
        "bot_user": {
            "display_name": "helper heidi",
            "always_online": false
        },
        "slash_commands": [
            {
                "command": "/add-{program}-macros",
                "url": "https://nephthys.hackclub.com/slack/events",
                "description": "Add or update a custom macro for this program",
                "usage_hint": "?<macro_name> <markdown_response> [--no-resolve] [--can-run-on-closed]",
                "should_escape": false
            },
            {
                "command": "/delete-{program}-macros",
                "url": "https://nephthys.hackclub.com/slack/events",
                "description": "Delete a custom macro for this program",
                "usage_hint": "?<macro_name>",
                "should_escape": false
            },
            {
                "command": "/list-{program}-macros",
                "url": "https://nephthys.hackclub.com/slack/events",
                "description": "List all custom macros for this program",
                "usage_hint": "",
                "should_escape": false
            }
        ]
    },
    "oauth_config": {
        "scopes": {
            "user": [
                "chat:write"
            ],
          "bot": [
                "channels:history",
                "channels:read",
                "chat:write",
                "chat:write.customize",
                "chat:write.public",
                "commands",
                "groups:history",
                "groups:read",
                "groups:write",
                "im:write",
                "mpim:read",
                "reactions:read",
                "reactions:write",
                "usergroups:read",
                "usergroups:write",
                "users:read",
                "users:read.email",
                "files:write"
            ]
        }
    },
    "settings": {
        "event_subscriptions": {
            "request_url": "https://nephthys.hackclub.com/slack/events",
            "bot_events": [
                "app_home_opened",
                "member_joined_channel",
                "member_left_channel",
                "message.channels",
                "message.groups"
            ]
        },
        "interactivity": {
            "is_enabled": true,
            "request_url": "https://nephthys.hackclub.com/slack/events",
            "message_menu_options_url": "https://nephthys.hackclub.com/slack/events"
        },
        "org_deploy_enabled": false,
        "socket_mode_enabled": false,
        "token_rotation_enabled": false
    }
}